name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned to a commit
        with:
          persist-credentials: false
      # the same Python that Flashcat uses on every Mac (Apple's command line tools)
      - name: Safety and feature tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Python 3.9 compatible
        run: /usr/bin/python3 -m py_compile bin/flashcat-chat.py
